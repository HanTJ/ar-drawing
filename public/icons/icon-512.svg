<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="#2196F3"/>

  <!-- Dog body -->
  <ellipse cx="256" cy="300" rx="100" ry="90" fill="#FFD700"/>

  <!-- Dog head -->
  <circle cx="256" cy="220" r="70" fill="#FFD700"/>

  <!-- Left ear -->
  <ellipse cx="210" cy="180" rx="25" ry="50" fill="#FFA500" transform="rotate(-30 210 180)"/>

  <!-- Right ear -->
  <ellipse cx="302" cy="180" rx="25" ry="50" fill="#FFA500" transform="rotate(30 302 180)"/>

  <!-- Left eye -->
  <circle cx="235" cy="210" r="8" fill="#333"/>
  <circle cx="238" cy="207" r="3" fill="#FFF"/>

  <!-- Right eye -->
  <circle cx="277" cy="210" r="8" fill="#333"/>
  <circle cx="280" cy="207" r="3" fill="#FFF"/>

  <!-- Nose -->
  <ellipse cx="256" cy="235" rx="10" ry="8" fill="#333"/>

  <!-- Mouth (smile) -->
  <path d="M 246 245 Q 256 255 266 245" stroke="#333" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Left front leg -->
  <rect x="220" y="360" width="25" height="60" rx="12" fill="#FFD700"/>

  <!-- Right front leg -->
  <rect x="267" y="360" width="25" height="60" rx="12" fill="#FFD700"/>

  <!-- Tail -->
  <path d="M 340 290 Q 370 280 380 310" stroke="#FFA500" stroke-width="20" fill="none" stroke-linecap="round"/>

  <!-- Pen holder (behind dog) -->
  <rect x="150" y="250" width="15" height="120" rx="7" fill="#8B4513"/>

  <!-- Pen -->
  <g transform="translate(120, 200) rotate(-25)">
    <!-- Pen body -->
    <rect x="0" y="0" width="12" height="100" rx="6" fill="#4A90E2"/>
    <!-- Pen tip -->
    <polygon points="6,100 0,110 12,110" fill="#333"/>
    <!-- Pen cap -->
    <rect x="0" y="-15" width="12" height="15" rx="6" fill="#2E5C8A"/>
    <!-- Pen clip -->
    <rect x="10" y="-10" width="8" height="3" rx="1.5" fill="#999"/>
  </g>

  <!-- Sparkles/Drawing effect -->
  <circle cx="380" cy="200" r="4" fill="#FFF" opacity="0.8"/>
  <circle cx="400" cy="220" r="3" fill="#FFF" opacity="0.8"/>
  <circle cx="390" cy="180" r="5" fill="#FFF" opacity="0.8"/>

  <!-- Small paw print -->
  <g transform="translate(350, 350)" opacity="0.3">
    <circle cx="0" cy="0" r="6" fill="#FFA500"/>
    <circle cx="-8" cy="-8" r="4" fill="#FFA500"/>
    <circle cx="8" cy="-8" r="4" fill="#FFA500"/>
    <circle cx="-6" cy="-15" r="3" fill="#FFA500"/>
    <circle cx="6" cy="-15" r="3" fill="#FFA500"/>
  </g>
</svg>
