<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Icon Generator</title>
</head>
<body>
    <h1>PWA Icon Generator</h1>
    <p>SVG 아이콘을 PNG로 변환합니다.</p>
    <button onclick="generateIcons()">아이콘 생성</button>
    <div id="output"></div>

    <script>
        async function generateIcons() {
            const sizes = [192, 512];
            const output = document.getElementById('output');
            output.innerHTML = '<p>아이콘 생성 중...</p>';

            try {
                const response = await fetch('/icon.svg');
                const svgText = await response.text();

                for (const size of sizes) {
                    const canvas = document.createElement('canvas');
                    canvas.width = size;
                    canvas.height = size;
                    const ctx = canvas.getContext('2d');

                    const img = new Image();
                    const svgBlob = new Blob([svgText], { type: 'image/svg+xml' });
                    const url = URL.createObjectURL(svgBlob);

                    await new Promise((resolve, reject) => {
                        img.onload = () => {
                            ctx.drawImage(img, 0, 0, size, size);
                            URL.revokeObjectURL(url);
                            resolve();
                        };
                        img.onerror = reject;
                        img.src = url;
                    });

                    // PNG 다운로드
                    canvas.toBlob((blob) => {
                        const link = document.createElement('a');
                        link.download = `icon-${size}.png`;
                        link.href = URL.createObjectURL(blob);
                        link.click();
                    });

                    output.innerHTML += `<p>✓ icon-${size}.png 생성 완료</p>`;
                }

                output.innerHTML += '<p><strong>모든 아이콘 생성 완료!</strong></p>';
                output.innerHTML += '<p>다운로드된 파일을 public/icons/ 폴더에 넣어주세요.</p>';
            } catch (error) {
                output.innerHTML = `<p style="color: red;">오류: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
